name: Deploy

# Every merge to dev deploys the dev environment. Staging and production deploy
# from releases (release.yml). The release commit carries no code, so it skips
# the dev deploy.
on:
  push:
    branches: [dev]

jobs:
  dev:
    if: "${{ !startsWith(github.event.head_commit.message, 'chore: release') }}"
    uses: ./.github/workflows/deploy-env.yml
    secrets: inherit
    with:
      environment: dev
      api_host: api.dev.randomify.net
      pages_project: randomify-web-dev
